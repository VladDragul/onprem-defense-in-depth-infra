<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" role="img" aria-labelledby="t d">
  <title id="t">lab01 architecture</title>
  <desc id="d">lab01 opens no inbound port: visitors come via Cloudflare, administration via Tailscale. Arrows point from the side that opens the connection.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8c8c"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a9a9a9; font-size: 12.5px; }
      .h { fill: #ececec; font-size: 16px; font-weight: 700; }
      .s { fill: #9a9a9a; font-size: 12.5px; }
      .b { fill: #ececec; font-size: 14px; font-weight: 700; }
      .l { fill: #9a9a9a; font-size: 12px; }
      .box { fill: #202020; stroke: #3d3d3d; stroke-width: 1.2; }
      .grp { fill: #1c1c1c; stroke: #454545; stroke-width: 1.2; }
      .hard { fill: #262626; stroke: #4a4a4a; stroke-width: 1.2; }
      .arr { stroke: #8c8c8c; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="1100" height="880" rx="12" fill="#191919"/>

  <text x="30" y="40" class="h">lab01 opens no inbound port: visitors come via Cloudflare, admin via Tailscale</text>
  <text x="30" y="62" class="s">Arrows point from the side that opens the connection</text>

  <rect x="30" y="90" width="190" height="92" rx="10" class="box"/>
  <text x="48" y="118" class="b">Internet visitor</text>
  <text x="48" y="140">opens cyberuser.de</text>

  <rect x="290" y="90" width="250" height="92" rx="10" class="box"/>
  <text x="308" y="118" class="b">Cloudflare edge</text>
  <text x="308" y="140">DNS, TLS 1.3, cache, WAF allowlist</text>
  <text x="308" y="160">home IP never published</text>

  <rect x="590" y="90" width="230" height="92" rx="10" class="box"/>
  <text x="608" y="118" class="b">Cloudflare Workers + KV</text>
  <text x="608" y="140">contact form, homepage cards</text>
  <text x="608" y="160">form data never reaches lab01</text>

  <rect x="870" y="90" width="200" height="92" rx="10" class="box"/>
  <text x="888" y="118" class="b">Telegram bot</text>
  <text x="888" y="140">private alert channel</text>

  <rect x="590" y="200" width="230" height="62" rx="10" class="box"/>
  <text x="608" y="225" class="b">Thinkst canary (off-site)</text>
  <text x="608" y="246">e-mails if the bait key is used</text>

  <path d="M220,136 H286" class="arr"/>
  <text x="253" y="128" class="l" text-anchor="middle">HTTPS</text>
  <path d="M540,136 H586" class="arr"/>
  <text x="563" y="128" class="l" text-anchor="middle">routes</text>

  <rect x="30" y="290" width="1040" height="566" rx="12" fill="none" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="50" y="318" class="b">Home network: router with no port forwarding, UPnP blocked</text>

  <rect x="50" y="340" width="230" height="140" rx="10" class="box"/>
  <text x="68" y="368" class="b">Mac (main LAN)</text>
  <text x="68" y="390">FileVault on</text>
  <text x="68" y="408">encrypted Time Machine</text>
  <text x="68" y="426">Tailscale client</text>
  <text x="68" y="444">holds the age private key</text>
  <text x="68" y="462">pulls backup at 05:30</text>

  <rect x="310" y="332" width="740" height="504" rx="10" class="grp"/>
  <text x="330" y="360" class="b">lab01 (isolated guest Wi-Fi)</text>

  <rect x="330" y="376" width="700" height="150" rx="8" class="grp"/>
  <text x="1010" y="400" class="b" text-anchor="end">Rootless Podman pod (user pods, no shell)</text>

  <rect x="350" y="414" width="310" height="96" rx="10" class="box"/>
  <text x="368" y="440" class="b">cloudflared</text>
  <text x="368" y="462">outbound tunnel only</text>
  <text x="368" y="482">read-only, 0 capabilities, 512 MB</text>

  <rect x="700" y="414" width="310" height="96" rx="10" class="box"/>
  <text x="718" y="440" class="b">nginx (web)</text>
  <text x="718" y="462">GET and HEAD only, strict CSP, port 8080</text>
  <text x="718" y="482">honeytoken bait, security log</text>

  <path d="M660,462 H696" class="arr"/>

  <path d="M530,414 V186" class="arr"/>
  <text x="522" y="240" class="l" text-anchor="end">outbound tunnel</text>

  <rect x="330" y="550" width="220" height="120" rx="10" class="box"/>
  <text x="348" y="576" class="b">sshd</text>
  <text x="348" y="598">key-only, post-quantum KEX</text>
  <text x="348" y="616">Tailscale address only</text>
  <text x="348" y="634">admin Mac only</text>
  <text x="348" y="652">fail2ban, login alerts</text>

  <rect x="570" y="550" width="220" height="120" rx="10" class="box"/>
  <text x="588" y="576" class="b">config-backup</text>
  <text x="588" y="598">04:30 daily</text>
  <text x="588" y="616">tar streamed into age</text>
  <text x="588" y="634">no plaintext on disk</text>
  <text x="588" y="652">pulled over SSH</text>

  <rect x="810" y="550" width="220" height="120" rx="10" class="box"/>
  <text x="828" y="576" class="b">Watchers</text>
  <text x="828" y="598">SSH, sudo, ports, egress</text>
  <text x="828" y="616">tailnet, site, heartbeat</text>
  <text x="828" y="634">honeytokens, AIDE, Lynis</text>
  <text x="828" y="652">disk health, failed units</text>

  <rect x="330" y="690" width="700" height="126" rx="10" class="hard"/>
  <text x="348" y="716" class="b">Host hardening</text>
  <text x="348" y="740">LUKS2 (AES-256 XTS), Secure Boot, TPM 2.0, kernel lockdown, IOMMU</text>
  <text x="348" y="760">ufw deny in and out, AppArmor, auditd, AIDE, Lynis index 84</text>
  <text x="348" y="780">Livepatch, DNS over TLS with DNSSEC, NTS-authenticated time</text>
  <text x="348" y="800">containers: seccomp, no-new-privileges, read-only root, resource limits</text>

  <path d="M165,480 V610 H326" class="arr"/>
  <text x="175" y="580" class="l">SSH via Tailscale</text>
  <text x="175" y="598" class="l">(WireGuard)</text>

  <path d="M1030,610 H1058 V186" class="arr"/>
  <text x="1050" y="240" class="l" text-anchor="end">alerts over HTTPS</text>
</svg>
